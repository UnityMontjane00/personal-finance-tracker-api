<!DOCTYPE html>
<html lang="en">
<head>
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>Personal Finance Tracker</h1>

<div class="cards">

    <div class="card balance - card">
        <h3>Balance</h3>
        <p id="balance">R0.00</p>
    </div>

    <div class="card income card">
        <h3>Income</h3>
        <p id="income">R0.00</p>
    </div>

    <div class="card expense card">
        <h3>Expenses</h3>
        <p id="expenses">R0.00</p>
    </div>

</div>
<h2>Add Transaction</h2>

<form id="transactionForm">


    <label for="description"></label><input type="text" id="description"
                                            placeholder="Description" required>

    <label for="amount"></label><input type="number" id="amount"
                                       placeholder="Amount" required>

    <label for="category"></label><input type="text" id="category"
                                         placeholder="Category" required>

    <label for="type"></label><select id="type">
        <option value="INCOME">INCOME</option>
        <option value="EXPENSE">EXPENSE</option>
    </select>

    <button type="submit">
        Add Transaction
    </button>

</form>
<h2>Transactions</h2>

<table id="transactionTable">

    <thead>
    <tr>
        <th>ID</th>
        <th>Description</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Type</th>
        <th>Actions</th>

    </tr>
    </thead>

    <tbody>

    </tbody>

</table>
<script src="js/app.js"></script>
</body>

</html>
